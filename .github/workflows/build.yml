name: Build

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Release / AnyCPU)
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build and self-test
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass `
            -File .\build.ps1 -Configuration Release -SelfTest

      - name: Upload build and self-test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PresentationFramework.Theme-${{ github.sha }}
          if-no-files-found: warn
          path: |
            ThemeDemo/bin/Release/
            NativeComparison/bin/Release/
            WpfApplicationTest/bin/Release/
            artifacts/selftest-plain/
            artifacts/selftest-transition/

  publish:
    name: Publish NuGet (tag)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-2022
    timeout-minutes: 20
    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Build Release
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass `
            -File .\build.ps1 -Configuration Release

      - name: Pack
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'Tag must look like v1.0.0.'
          }
          New-Item -ItemType Directory -Force .\artifacts\nuget | Out-Null
          nuget pack .\nuget\Win32ThemeStyle.WPF.nuspec `
            -Version $version `
            -OutputDirectory .\artifacts\nuget

      - name: NuGet login (Trusted Publishing)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $package = ".\artifacts\nuget\Win32ThemeStyle.WPF.$version.nupkg"
          if (-not (Test-Path $package)) {
            throw "Package not found: $package"
          }
          nuget push $package `
            -Source https://api.nuget.org/v3/index.json `
            -ApiKey ${{ steps.nuget-login.outputs.NUGET_API_KEY }} `
            -SkipDuplicate
