name: Build

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Release / AnyCPU)
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Install .NET Framework 4.0 reference assemblies
        shell: pwsh
        run: |
          $url = 'https://api.nuget.org/v3-flatcontainer/microsoft.netframework.referenceassemblies.net40/1.0.3/microsoft.netframework.referenceassemblies.net40.1.0.3.nupkg'
          $nupkg = Join-Path $env:TEMP 'net40-reference-assemblies.nupkg'
          $zip = Join-Path $env:TEMP 'net40-reference-assemblies.zip'
          $packageRoot = Join-Path $env:TEMP 'net40-reference-assemblies'
          Invoke-WebRequest -Uri $url -OutFile $nupkg
          Copy-Item $nupkg $zip -Force
          if (Test-Path $packageRoot) { Remove-Item $packageRoot -Recurse -Force }
          Expand-Archive -Path $zip -DestinationPath $packageRoot -Force
          $source = Join-Path $packageRoot 'build\.NETFramework\v4.0'
          $destination = 'C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.0'
          if (-not (Test-Path $source)) {
            throw "Reference assemblies not found: $source"
          }
          New-Item -ItemType Directory -Force $destination | Out-Null
          Copy-Item "$source\*" -Destination $destination -Recurse -Force
      - name: Build
        shell: pwsh
        run: |
          $log = Join-Path $env:GITHUB_WORKSPACE 'build.log'
          try {
            powershell -NoProfile -ExecutionPolicy Bypass `
              -File .\build.ps1 -Configuration Release 2>&1 |
              Tee-Object -FilePath $log
            if ($LASTEXITCODE -ne 0) {
              throw "build.ps1 exited with $LASTEXITCODE"
            }
          }
          catch {
            $_ | Out-String | Add-Content $log
            Get-Content $log | Select-Object -Last 40 |
              ForEach-Object { Write-Output "::error title=Build failure::$_" }
            throw
          }

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PresentationFramework.Theme-${{ github.sha }}
          if-no-files-found: warn
          path: |
            ThemeDemo/bin/Release/
            NativeComparison/bin/Release/
            WpfApplicationTest/bin/Release/
            artifacts/selftest-plain/
            artifacts/selftest-transition/
            build.log

  publish:
    name: Publish NuGet (tag)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-2022
    timeout-minutes: 20
    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Install .NET Framework 4.0 reference assemblies
        shell: pwsh
        run: |
          $url = 'https://api.nuget.org/v3-flatcontainer/microsoft.netframework.referenceassemblies.net40/1.0.3/microsoft.netframework.referenceassemblies.net40.1.0.3.nupkg'
          $nupkg = Join-Path $env:TEMP 'net40-reference-assemblies.nupkg'
          $zip = Join-Path $env:TEMP 'net40-reference-assemblies.zip'
          $packageRoot = Join-Path $env:TEMP 'net40-reference-assemblies'
          Invoke-WebRequest -Uri $url -OutFile $nupkg
          Copy-Item $nupkg $zip -Force
          if (Test-Path $packageRoot) { Remove-Item $packageRoot -Recurse -Force }
          Expand-Archive -Path $zip -DestinationPath $packageRoot -Force
          $source = Join-Path $packageRoot 'build\.NETFramework\v4.0'
          $destination = 'C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.0'
          if (-not (Test-Path $source)) {
            throw "Reference assemblies not found: $source"
          }
          New-Item -ItemType Directory -Force $destination | Out-Null
          Copy-Item "$source\*" -Destination $destination -Recurse -Force
      - name: Build Release
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass `
            -File .\build.ps1 -Configuration Release

      - name: Pack
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'Tag must look like v1.0.0.'
          }
          New-Item -ItemType Directory -Force .\artifacts\nuget | Out-Null
          $packLog = Join-Path $env:GITHUB_WORKSPACE 'pack.log'
          nuget pack .\nuget\Win32ThemeStyle.WPF.nuspec `
            -Version $version `
            -OutputDirectory .\artifacts\nuget 2>&1 |
            Tee-Object -FilePath $packLog
          if ($LASTEXITCODE -ne 0) {
            Get-Content $packLog | ForEach-Object { Write-Output "::error title=NuGet pack::$_" }
            throw "nuget pack exited with $LASTEXITCODE"
          }

      - name: NuGet login (Trusted Publishing)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Inspect package
        shell: pwsh
        run: |
          # A push that exits 0 but publishes nothing usually means the server treated the
          # upload as a duplicate, so check what the package really declares first.
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $package = ".\artifacts\nuget\Win32ThemeStyle.WPF.$version.nupkg"
          $dir = Join-Path $env:RUNNER_TEMP 'nupkg'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Expand-Archive -Path $package -DestinationPath $dir -Force
          $nuspec = Get-ChildItem $dir -Filter *.nuspec | Select-Object -First 1
          [xml]$spec = (Get-Content $nuspec.FullName -Raw)
          $inner = $spec.package.metadata.version
          Write-Output "tag version   : $version"
          Write-Output "nuspec version: $inner"
          Write-Output "package size  : $((Get-Item $package).Length)"
          if ($inner -ne $version) {
            throw "nuspec declares $inner but the tag says $version"
          }

      - name: Push to nuget.org
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $package = ".\artifacts\nuget\Win32ThemeStyle.WPF.$version.nupkg"
          if (-not (Test-Path $package)) {
            throw "Package not found: $package"
          }
          $pushLog = Join-Path $env:GITHUB_WORKSPACE 'push.log'
          nuget push $package `
            -Source https://api.nuget.org/v3/index.json `
            -ApiKey ${{ steps.nuget-login.outputs.NUGET_API_KEY }} `
            -SkipDuplicate 2>&1 |
            Tee-Object -FilePath $pushLog
          if ($LASTEXITCODE -ne 0) {
            Get-Content $pushLog | ForEach-Object { Write-Output "::error title=NuGet push::$_" }
            throw "nuget push exited with $LASTEXITCODE"
          }

      - name: Verify publication
        shell: pwsh
        run: |
          # The 1.0.8 attempt reported a successful push but never appeared on nuget.org,
          # so the pipeline now proves publication instead of trusting the exit code.
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $uri = "https://www.nuget.org/api/v2/Packages()?`$filter=Id eq 'Win32ThemeStyle.WPF' and Version eq '$version'"
          for ($i = 1; $i -le 12; $i++) {
            Start-Sleep -Seconds 10
            $raw = (Invoke-WebRequest -Uri $uri -UseBasicParsing).Content
            $count = ([xml]$raw).feed.'m:count'
            Write-Output "attempt $i : count=$count"
            if ([int]$count -gt 0) {
              Write-Output "$version is live on nuget.org"
              exit 0
            }
          }
          throw "$version never appeared on nuget.org"

      - name: Unlist superseded versions
        shell: pwsh
        run: |
          # 1.0.1 was superseded straight away.  1.0.5 and 1.0.6 shipped the HackBorder
          # measurement defect: the inner art claimed the bitmap's natural size, so WPF's
          # ArrangeCore refused to shrink it and the art spilled out of a small border.
          #
          # `nuget delete` has to target the V2 endpoint.  Against the V3 index nuget.exe
          # gets a 405 back, which is why the earlier version of this step never unlisted
          # anything -- continue-on-error turned that into a green tick.
          $source = 'https://www.nuget.org/api/v2/package'
          foreach ($old in @('1.0.1', '1.0.5', '1.0.6')) {
            Write-Output "unlisting $old"
            nuget delete Win32ThemeStyle.WPF $old `
              -Source $source `
              -ApiKey ${{ steps.nuget-login.outputs.NUGET_API_KEY }} `
              -NonInteractive 2>&1 | Write-Output
            if ($LASTEXITCODE -ne 0) {
              Write-Output "::warning title=NuGet unlist::$old exited with $LASTEXITCODE"
            }
          }

          # Unlisting is housekeeping: the package is already published by the step above, so a
          # failure here must not fail the build.  GitHub appends `exit $LASTEXITCODE` to a pwsh
          # step, which is what turned the previous attempt red -- clear it explicitly.
          exit 0
